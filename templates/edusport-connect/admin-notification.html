<!-- EMAIL_SUBJECT: Nouveau message de contact - ÉduSport Connect -->
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notification administrateur - ÉduSport Connect</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.6;
            color: #0f2e3d;
            background-color: #eef4f6;
            padding: 20px 0;
        }
        .email-wrapper {
            max-width: 600px;
            margin: 0 auto;
            background-color: #ffffff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .header {
            background: linear-gradient(135deg, #0a6e62 0%, #11998e 50%, #1f8fb8 100%);
            padding: 30px;
            text-align: center;
        }
        .header-title { color: #ffffff; font-size: 22px; font-weight: 700; margin: 0; }
        .content { padding: 40px 30px; }
        .message-label {
            font-size: 12px;
            font-weight: 600;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
        }
        .message-box {
            background-color: #f0faf8;
            border-left: 4px solid #0a6e62;
            padding: 25px;
            border-radius: 8px;
            margin: 25px 0;
        }
        .message-text { color: #334155; font-size: 15px; line-height: 1.8; white-space: pre-wrap; }
        .divider { height: 1px; background: linear-gradient(to right, transparent, #d7e6e9, transparent); margin: 30px 0; }
        .footer {
            background-color: #f0faf8;
            padding: 20px 30px;
            text-align: center;
            border-top: 1px solid #d7e6e9;
            font-size: 12px;
            color: #64748b;
        }
        @media only screen and (max-width: 600px) {
            .email-wrapper { margin: 0 10px; border-radius: 8px; }
            .header { padding: 20px; }
            .content { padding: 30px 20px; }
        }
    </style>
</head>
<body>
    <div class="email-wrapper">
        <div class="header">
            <h1 class="header-title">Nouveau message de contact</h1>
        </div>

        <div class="content">
            <p class="message-label" style="margin-bottom: 16px;">Expéditeur</p>
            <table style="width: 100%; border-collapse: collapse; font-size: 14px; color: #334155;">
                <tr><td style="padding: 8px 0; border-bottom: 1px solid #e2e8f0; font-weight: 600; color: #64748b; width: 140px;">Nom</td><td style="padding: 8px 0; border-bottom: 1px solid #e2e8f0;">{{ sender_name }}</td></tr>
                <tr><td style="padding: 8px 0; border-bottom: 1px solid #e2e8f0; font-weight: 600; color: #64748b;">Email</td><td style="padding: 8px 0; border-bottom: 1px solid #e2e8f0;"><a href="mailto:{{ sender_email }}" style="color: #0a6e62;">{{ sender_email }}</a></td></tr>
                <tr><td style="padding: 8px 0; font-weight: 600; color: #64748b;">Objet</td><td style="padding: 8px 0;">{{ subject }}</td></tr>
            </table>

            <div class="message-box" style="margin-top: 24px;">
                <div class="message-label">Message</div>
                <div class="message-text">{{ message }}</div>
            </div>

            <div class="divider"></div>

            <p style="font-size: 14px; color: #64748b; text-align: center;">
                Ceci est une notification automatique du site ÉduSport Connect.
            </p>
        </div>

        <div class="footer">
            <p>Email automatique - ÉduSport Connect</p>
            <p>Ne pas répondre à cet email</p>
        </div>
    </div>
</body>
</html>
