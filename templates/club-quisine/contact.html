<!-- EMAIL_SUBJECT: Nouveau message depuis le site - Club Quisine -->
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nouveau message - Club Quisine</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Nunito', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            line-height: 1.6;
            color: #2D1F0E;
            background-color: #FFFBF5;
            padding: 20px 0;
        }
        .email-wrapper {
            max-width: 600px;
            margin: 0 auto;
            background-color: #ffffff;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid #F2EADF;
        }
        .header { background-color: #2D1F0E; padding: 28px 30px; }
        .brand { font-family: Georgia, 'Playfair Display', serif; font-style: italic; font-size: 22px; color: #ffffff; }
        .brand-accent { color: #FF8C42; }
        .header-sub { color: rgba(255, 255, 255, 0.65); font-size: 13px; margin-top: 4px; }
        .content { padding: 32px 30px; }
        .label {
            font-size: 12px;
            font-weight: 700;
            color: #9A7050;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 12px;
        }
        .info { width: 100%; border-collapse: collapse; font-size: 14px; color: #5C4025; }
        .info td { padding: 8px 0; border-bottom: 1px solid #F2EADF; vertical-align: top; }
        .info td.key { width: 90px; font-weight: 700; color: #9A7050; }
        .message-box {
            background-color: #FFFBF5;
            border-left: 4px solid #FF8C42;
            border-radius: 8px;
            padding: 20px 22px;
            margin-top: 24px;
        }
        .message-text { color: #2D1F0E; font-size: 15px; line-height: 1.7; white-space: pre-wrap; word-wrap: break-word; }
        .hint { font-size: 13px; color: #7A5535; margin-top: 24px; }
        .footer {
            background-color: #FFFBF5;
            padding: 18px 30px;
            text-align: center;
            border-top: 1px solid #F2EADF;
            font-size: 12px;
            color: #9A7050;
        }
        @media only screen and (max-width: 600px) {
            .email-wrapper { margin: 0 10px; border-radius: 10px; }
            .content { padding: 24px 20px; }
        }
    </style>
</head>
<body>
    <div class="email-wrapper">
        <div class="header">
            <div class="brand">Club <span class="brand-accent">Quisine</span></div>
            <div class="header-sub">Nouveau message reçu par le formulaire de contact</div>
        </div>

        <div class="content">
            <p class="label">Expéditeur</p>
            <table class="info">
                <tr><td class="key">Nom</td><td>{{ sender_name }}</td></tr>
                <tr><td class="key">Email</td><td><a href="mailto:{{ sender_email }}" style="color: #E8651A; font-weight: 700;">{{ sender_email }}</a></td></tr>
                <tr><td class="key">Sujet</td><td>{{ subject }}</td></tr>
                <tr><td class="key">Reçu le</td><td>{{ received_at }}</td></tr>
            </table>

            <div class="message-box">
                <p class="label">Message</p>
                <div class="message-text">{{ message }}</div>
            </div>

            <p class="hint">Répondre à cet email écrit directement à l'expéditeur.</p>
        </div>

        <div class="footer">
            Envoyé depuis quisine.zenixweb.fr
        </div>
    </div>
</body>
</html>
