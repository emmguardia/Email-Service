name: ESLint

# Analyse statique avec remontée dans l'onglet Security via SARIF.
#
# Le lint bloquant, lui, est dans build-and-push.yml (`pnpm lint`) : c'est lui
# qui empêche un déploiement. Ce workflow-ci sert au rapport et aux annotations
# de PR, d'où le `|| true` — un échec de lint ne doit pas empêcher l'upload du
# rapport qui explique justement ce qui ne va pas.

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.npmrc'
      - 'eslint.config.js'
      - '.github/workflows/eslint.yml'
  workflow_dispatch:

jobs:
  eslint:
    name: Run ESLint scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '26'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # Le formateur SARIF est installé à la volée plutôt que d'alourdir les
      # devDependencies du projet pour un usage exclusivement CI.
      - name: Install SARIF Formatter
        run: pnpm add -D @microsoft/eslint-formatter-sarif@3.1.0

      # Le SARIF vide est écrit d'abord : si eslint plante avant d'avoir produit
      # son rapport, l'upload a quand même un fichier valide à envoyer au lieu
      # de faire échouer le job sur un fichier manquant.
      - name: Run ESLint
        env:
          SARIF_ESLINT_IGNORE_SUPPRESSED: "true"
        run: |
          echo '{"version":"2.1.0","$schema":"https://json.schemastore.org/sarif-2.1.0.json","runs":[{"tool":{"driver":{"name":"ESLint","rules":[]}},"results":[]}]}' > eslint-results.sarif
          pnpm exec eslint src/ \
            --format @microsoft/eslint-formatter-sarif \
            --output-file eslint-results.sarif || true

      - name: Upload analysis results to GitHub
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: ./eslint-results.sarif
          wait-for-processing: true
