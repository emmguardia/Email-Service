# Build and push Email-Service: main → version + digest (prod)
# ArgoCD: App Prod = branche main + namespace email-service
#
# Service mono-conteneur : un seul package.json et un seul Dockerfile à la racine.
#
# Runners GitHub-hosted ubuntu-latest (illimités pour repo public).
# pnpm + minimum-release-age 24h pour défense supply-chain.
#
# Secrets GitHub requis : aucun en dehors du GITHUB_TOKEN fourni par la plateforme.
#
# ── CE QUI A CHANGÉ ──────────────────────────────────────────────────────────
#
# L'ordre build -> scan -> push était déjà correct ici, contrairement à d'autres
# repos. Les corrections portent sur le reste :
#
# 1. L'image scannée est exactement l'image poussée.
#    L'étape de push relançait un `docker build` distinct de celui qui avait
#    servi au scan Trivy : rien ne garantissait qu'elles soient identiques. On
#    builde une seule fois avec `load: true`, on scanne, puis `docker tag` +
#    `docker push` de ce binaire-là.
#
# 2. Le pin de digest est vérifié avant ET après le sed. Un sed qui ne matchait
#    rien laissait le job passer au vert sans rien déployer.
#
# 3. npm -> pnpm, builder Node 20 -> 26. pnpm apporte
#    `minimum-release-age=1440` (.npmrc) : aucun paquet publié depuis moins de
#    24 h n'est installé. npm n'a aucun équivalent.
#
# 4. `pnpm audit --prod` : l'audit ne bloque plus sur des paquets qui ne partent
#    jamais en production.
#
# 5. cancel-in-progress: false — ce job pousse une image puis commite le digest.
#    L'annuler entre les deux désynchronise le dépôt du registre.
#
# 6. Le lint devient bloquant (il ne tournait que sur les PRs via eslint.yml).

name: Build and push to GHCR

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build'
        required: true
        default: 'main'
        type: choice
        options:
          - main

env:
  REGISTRY: ghcr.io
  TRIVY_IMAGE: aquasec/trivy:0.73.0
  PNPM_VERSION: 10.33.4
  NODE_VERSION: '26'

permissions:
  contents: read
  packages: write

concurrency:
  group: build-and-push-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  test:
    name: Test & security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Audit (prod, high+)
        run: pnpm audit --prod --audit-level high

      - name: Lint
        run: pnpm lint

      # ATTENTION : le script `test` est actuellement
      # `echo "Error: no test specified" && exit 0` — il ne teste rien et passe
      # toujours. Cette étape est décorative tant qu'aucun vrai test n'est écrit.
      - name: Test
        run: pnpm run --if-present test

  build-and-push:
    name: Build and push
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump version (prod)
        id: tag
        run: |
          set -euo pipefail
          CONTENT=$(cat version.txt | tr -d '\r\n ')
          MAJOR=$(echo "$CONTENT" | cut -d. -f1)
          MINOR=$(echo "$CONTENT" | cut -d. -f2)
          PATCH=$(echo "$CONTENT" | cut -d. -f3)
          if ! [[ "$MAJOR" =~ ^[0-9]+$ ]] || ! [[ "$MINOR" =~ ^[0-9]+$ ]] || ! [[ "$PATCH" =~ ^[0-9]+$ ]]; then
            echo "::error::version.txt invalide: $CONTENT (attendu X.Y.Z)"
            exit 1
          fi
          if [ "$PATCH" -lt 99 ]; then
            PATCH=$((PATCH + 1))
          else
            PATCH=0
            MINOR=$((MINOR + 1))
          fi
          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "$NEW_VERSION" > version.txt
          # garder package.json aligné — c'est la version lue par l'app au runtime
          sed -i "s/\"version\": \"[0-9]*\.[0-9]*\.[0-9]*\"/\"version\": \"${NEW_VERSION}\"/" package.json
          if ! grep -q "\"version\": \"${NEW_VERSION}\"" package.json; then
            echo "::error::La version n'a pas été répercutée dans package.json."
            exit 1
          fi
          TAG="v${NEW_VERSION}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Version: $CONTENT → $NEW_VERSION (tag: $TAG)"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/email-service
          tags: |
            type=raw,value=${{ steps.tag.outputs.tag }}

      # Build UNIQUE, chargé dans le démon Docker local. Aucun push ici.
      # C'est ce binaire précis qui sera scanné puis publié.
      - name: Build (local)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: email-service:candidate
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          pull: true

      - name: Trivy scan (avant push)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            ${{ env.TRIVY_IMAGE }} image --exit-code 1 --severity CRITICAL,HIGH --ignore-unfixed --format table --timeout 15m \
            email-service:candidate

      - name: Push
        id: push
        env:
          META_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          TARGET=$(printf '%s\n' "$META_TAGS" | head -1)
          docker tag email-service:candidate "$TARGET"
          PUSH_OUT=$(docker push "$TARGET" | tee /dev/stderr)
          DIGEST=$(docker buildx imagetools inspect "$TARGET" --format '{{.Manifest.Digest}}' 2>/dev/null || true)
          if [ -z "$DIGEST" ]; then
            DIGEST=$(printf '%s\n' "$PUSH_OUT" | grep -oE 'sha256:[0-9a-f]{64}' | tail -1 || true)
          fi
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Publié : $TARGET (digest: ${DIGEST:-introuvable})"

      # ── Pin digest dans values.yaml → ArgoCD sync automatique ────────────────
      - name: Pin Helm values to image digest
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          BRANCH: ${{ github.ref_name }}
          DIGEST: ${{ steps.push.outputs.digest }}
          OWNER: ${{ github.repository_owner }}
          REG: ${{ env.REGISTRY }}
        run: |
          set -euo pipefail
          VALUES_PATH="charts/email-service/values.yaml"

          if [ -n "${DIGEST:-}" ]; then
            IMAGE="${REG}/${OWNER}/email-service@${DIGEST}"
          else
            IMAGE="${REG}/${OWNER}/email-service:${TAG}"
            echo "::warning::Digest introuvable, pin sur le tag ${TAG} (déploiement OK mais non immuable)."
          fi

          # Garde-fou contre le déploiement fantôme : un sed muet passait au vert
          # sans rien changer. `email-service` est une clé distincte de l'image
          # redis:7.x également présente dans ce values.yaml, qui n'est pas
          # hébergée sur ghcr.io — le motif ne peut pas la toucher.
          if ! grep -qE "^[[:space:]]+image:[[:space:]]*ghcr\.io/.*email-service[@:]" "$VALUES_PATH"; then
            echo "::error::Aucune ligne 'image:' pour email-service dans ${VALUES_PATH}. Le pin de digest aurait échoué en silence."
            exit 1
          fi
          sed -i -E "s|^([[:space:]]+)image:[[:space:]]*ghcr\.io/.*email-service[@:].*|\1image: ${IMAGE}|" "$VALUES_PATH"
          if ! grep -qF "image: ${IMAGE}" "$VALUES_PATH"; then
            echo "::error::Le remplacement n'a pas pris dans ${VALUES_PATH}."
            exit 1
          fi
          echo "  email-service → ${IMAGE}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.txt package.json "$VALUES_PATH"

          if git diff --staged --quiet; then
            echo "::warning::Rien à commiter alors que le pin a réussi — values.yaml pointait déjà sur ce digest."
          else
            git commit -m "chore(helm): pin image to digest ${TAG} [skip ci]"

            pushed=false
            for attempt in 1 2 3; do
              if git push origin "HEAD:${BRANCH}"; then
                pushed=true
                break
              fi
              echo "::warning::Push refusé (tentative ${attempt}/3), rebase sur origin/${BRANCH}…"
              git fetch origin "$BRANCH"
              if ! git rebase "origin/${BRANCH}"; then
                git rebase --abort || true
                echo "::error::Conflit de rebase sur ${BRANCH}, intervention manuelle requise."
                exit 1
              fi
              sleep $((attempt * 3))
            done
            if [ "$pushed" != "true" ]; then
              echo "::error::Impossible de pousser le pin de digest après 3 tentatives."
              exit 1
            fi
          fi

          {
            echo "### Déploiement ${TAG}"
            echo "- Image : \`${IMAGE}\`"
            echo ""
            echo "Image scannée par Trivy avant publication. ArgoCD synchronise le cluster dans les minutes qui suivent."
          } >> "$GITHUB_STEP_SUMMARY"
