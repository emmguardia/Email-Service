version: 2
updates:
  # NPM : group prod et dev pour réduire le nombre de PRs.
  # Les patchs/mineurs sont auto-mergés via dependabot-auto-merge.yml.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    groups:
      production:
        dependency-type: production
        update-types: ["patch", "minor"]
      development:
        dependency-type: development
        update-types: ["patch", "minor"]
    ignore:
      # Major bumps : revue manuelle (souvent breaking).
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # GitHub Actions : group + ignore majors (cassent souvent les workflows).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
        update-types: ["patch", "minor"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Docker : on ignore les bumps majors de Node (builder fixé sur LTS,
  # runtime piloté par Chainguard `:latest` qui rebuild quotidien).
  # Seuls les patchs (sécurité) passent en auto.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 1
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "cgr.dev/chainguard/node"
