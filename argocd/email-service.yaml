# Application ArgoCD pour l'environnement Prod
# À appliquer : kubectl apply -f argocd/email-service.yaml -n argocd
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: email-service
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/emmguardia/Email-Service
    targetRevision: main
    path: charts/email-service
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: email-service
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
